<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>影の中で、君を待つ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'SF Pro Display','Helvetica Neue','Hiragino Sans','PingFang SC','Microsoft YaHei',sans-serif;background:#FFF;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game-container{width:100%;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:#FFF;transition:transform .8s}
#game-container.warm .bubble.others{background:#FFE7CF;color:#5a3520}
#game-container.warm .typing-indicator{background:#FFE7CF}
#game-container.warm #nav-bar{border-bottom-color:rgba(90,53,32,.15)}
#game-container.warm #message-input:focus{border-color:#B87333;background:#FFF8F0}
#game-container.warm #send-btn{background:#B87333}
#game-container.faded .bubble.others{opacity:.35;transition:opacity 3s}
#game-container.unstable .bubble.others{opacity:.82}
.bubble.fading{opacity:.22;transition:opacity 2s}
#game-container.faded .typing-indicator{opacity:.35;transition:opacity 3s}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;z-index:9999;opacity:1;transition:opacity .8s;pointer-events:none}
#overlay.hidden{opacity:0}
#status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px;padding-top:env(safe-area-inset-top);font-size:14px;font-weight:600;flex-shrink:0;background:inherit;z-index:10;transition:color .5s}
#status-time{font-size:15px;font-weight:700}
#status-icons span{margin-left:6px}
#nav-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid rgba(0,0,0,.08);flex-shrink:0;background:inherit;z-index:10;min-height:44px}
#nav-contact{font-size:16px;font-weight:600;text-align:center;flex:1;transition:color .5s}
#nav-back,#nav-info{width:30px;text-align:center;color:#0A84FF;font-size:20px}
#messages-area{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:4px;background:inherit;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#messages-area::-webkit-scrollbar{display:none}
.msg-row{display:flex;margin-bottom:2px;animation:msg-appear .25s ease-out}
.msg-row.others{justify-content:flex-start}
.msg-row.self{justify-content:flex-end}
.bubble{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.5;word-break:break-word;position:relative;white-space:pre-line}
.bubble.others{background:#E9E9EB;color:#1a1a1a;border-bottom-left-radius:5px}
.bubble.self{background:#34C759;color:#fff;border-bottom-right-radius:5px}
.bubble.translucent{opacity:.3;transition:opacity 2s}
.bubble.finalfade{opacity:.06;transition:opacity 2.8s}
.bubble.hot{background:#F5D7CE;color:#7a2016}
.bubble.hot.glitch{animation:glitch-jitter .16s steps(2) infinite;text-shadow:1px 0 rgba(255,0,0,.4),-1px 0 rgba(0,120,255,.35)}
.bubble.glitch{animation:glitch-jitter .16s steps(2) infinite;text-shadow:1px 0 rgba(255,0,0,.5),-1px 0 rgba(0,120,255,.5)}
.bubble.deform{transform:scale(1.03,.96);margin-top:2px}
.bubble.garble{background:transparent;color:#B85A6B;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;line-height:1.6;padding:2px 0}
@keyframes glitch-jitter{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,1px)}}
@keyframes msg-appear{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.bubble.recalling{animation:recall .35s ease-in forwards;pointer-events:none}
@keyframes recall{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85) skewX(-8deg)}100%{opacity:0;transform:scale(.4) translateY(-20px)}}
.typing-indicator{display:inline-flex;gap:4px;padding:10px 14px;background:#E9E9EB;color:#1a1a1a;border-radius:18px;border-bottom-left-radius:5px;animation:msg-appear .2s}
.typing-indicator span{width:7px;height:7px;background:#8E8E93;border-radius:50%;animation:typing-bounce 1.2s infinite}
.typing-indicator span:nth-child(2){animation-delay:.15s}
.typing-indicator span:nth-child(3){animation-delay:.3s}
.typing-indicator.jitter span{animation-duration:.5s;animation-name:typing-bounce-j}
@keyframes typing-bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@keyframes typing-bounce-j{0%,100%{transform:translate(0,0);opacity:.7}20%{transform:translate(-2px,-5px);opacity:1}40%{transform:translate(2px,-2px)}60%{transform:translate(-2px,-5px);opacity:1}80%{transform:translate(2px,-2px)}}
#input-bar{display:flex;align-items:center;padding:8px 10px calc(12px + env(safe-area-inset-bottom));gap:8px;border-top:1px solid rgba(0,0,0,.06);flex-shrink:0;background:inherit;z-index:10}
#message-input{flex:1;border:1px solid rgba(0,0,0,.12);border-radius:20px;padding:10px 16px;font-size:16px;font-family:inherit;background:rgba(0,0,0,.03);outline:none}
#message-input:focus{border-color:#0A84FF;background:#fff}
#message-input:disabled{background:rgba(0,0,0,.05);color:#8E8E93;opacity:.6}
#send-btn{width:34px;height:34px;border-radius:50%;border:none;background:#0A84FF;color:#fff;font-size:18px;cursor:pointer;display:flex;justify-content:center;align-items:center;flex-shrink:0;touch-action:manipulation}
#send-btn:disabled{background:#B0B0B5;opacity:.5}
#choice-container{display:none;gap:12px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));flex-shrink:0}
#choice-container.visible{display:flex}
.choice-btn{flex:1;padding:14px;border-radius:14px;border:1.5px solid #B0B0B5;background:rgba(255,255,255,.06);color:#fff;font-size:17px;font-family:inherit;font-weight:600;cursor:pointer;touch-action:manipulation;animation:msg-appear .4s}
.choice-btn.remember{border-color:#FFB84D;color:#FFB84D}
.choice-btn.remember:active{background:rgba(255,184,77,.16)}
.choice-btn.forget{border-color:#8E8E93;color:#C8C8CC}
.choice-btn.forget:active{background:rgba(142,142,147,.16)}
.system-notice{text-align:center;font-size:12px;color:#8E8E93;padding:8px 0;animation:msg-appear .3s}
.ending-screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;background:#000;color:#fff;animation:fade-in 1.5s}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.ending-text{font-size:22px;font-weight:700;text-align:center;line-height:1.7;letter-spacing:1px}
.ending-text .jp{display:block;font-size:26px;letter-spacing:3px}
.ending-text .zh{display:block;font-size:14px;color:#AEAEB2;font-weight:400;margin-top:10px}
.ending-sub{font-size:13px;color:#8E8E93;margin-top:18px;text-align:center}
.lock-clock{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;font-size:64px;font-weight:200;letter-spacing:1px;padding-top:36px}
.lock-date{font-size:15px;font-weight:400;color:#AEAEB2;margin-top:4px}
.lock-notif{position:absolute;bottom:15%;left:20px;right:20px;max-width:390px;margin:0 auto;background:rgba(30,30,32,.95);border-radius:16px;padding:14px 16px;box-shadow:0 6px 30px rgba(0,0,0,.55)}
.lock-notif .ln-app{font-size:12px;color:#8E8E93}
.lock-notif .ln-title{font-size:14px;font-weight:700;margin-top:2px}
.lock-notif .ln-text{font-size:17px;color:#f2f2f2;margin-top:6px}
.lock-hidden{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;color:#3A3A3C;letter-spacing:2px;opacity:0;transition:opacity 2s}
.ending-screen.reveal .lock-hidden{opacity:1;color:#5A5A5C}
#game-container.flipped{transform:rotate(180deg)}
.restart-btn{margin-top:34px;padding:10px 26px;border:1px solid rgba(255,255,255,.25);border-radius:22px;color:#D0D0D5;font-size:13px;letter-spacing:2px;background:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.restart-btn:active{background:rgba(255,255,255,.08)}
.name-reveal{animation:name-glow 2.5s ease-out}
@keyframes name-glow{from{text-shadow:0 0 18px rgba(255,184,77,.9);color:#FFD9A0}to{text-shadow:none;color:#fff}}
</style>
</head>
<body>
<div id="overlay"></div>
<div id="game-container">
<div id="status-bar">
<span id="status-time">00:00</span>
<span id="status-icons"><span id="status-signal">●●●○</span><span id="status-wifi">📶</span><span id="status-battery">🔋 87%</span></span>
</div>
<div id="nav-bar">
<span id="nav-back">‹</span>
<span id="nav-contact">未知号码</span>
<span id="nav-info">ⓘ</span>
</div>
<div id="messages-area"></div>
<div id="choice-container">
<button class="choice-btn remember" id="choice-remember">记住你</button>
<button class="choice-btn forget" id="choice-forget">忘记你</button>
</div>
<div id="input-bar">
<input id="message-input" type="text" placeholder="iMessage" autocomplete="off" autocapitalize="off" autocorrect="off">
<button id="send-btn" aria-label="发送">↑</button>
</div>
</div>
<script>
(function(){
var ST={INTRO:'INTRO',P1:'P1',P2:'P2',P3:'P3',P4:'P4',P5:'P5',P6:'P6',EW:'EW',EA:'EA',EB:'EB',EC:'EC',HE:'HE'};
var el={ov:document.getElementById('overlay'),st:document.getElementById('status-time'),nc:document.getElementById('nav-contact'),ma:document.getElementById('messages-area'),mi:document.getElementById('message-input'),sb:document.getElementById('send-btn'),cc:document.getElementById('choice-container'),cr:document.getElementById('choice-remember'),cf:document.getElementById('choice-forget'),ib:document.getElementById('input-bar'),gc:document.getElementById('game-container')};
var cs=null,p1c=0,p2c=0,p3c=0,lastTime=Date.now(),silTimer=null,ewTimer=null,mid=0,locked=false,ended=false,eaMode=false,hiddenStart=-1,navGlitchTimer=null,idleTimer=null,idlePhase=null,idleNudge1=false,idleNudge2=false,leftFlag=false,nameSpell='',lastReplyLen=0,warm=false,named=false,weak=false,p4Stage='name',p5Stage='intro',p5Replies=0,p5Panic=false,stablePath=false,p5IdleTimer=null,p5HiddenAt=-1,eaReplied=false,eaDone=false;
var KEY_F='hyakki_forgot';
var GCHAR='龘魑魅魍鬽傀魈魂魄幽冥暗昧影煞瘆饕餮影忘消見君名字あいうえお';
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function scrollBottom(){el.ma.scrollTop=el.ma.scrollHeight}
function vibrate(p){if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function glitchStr(s,chance){
chance=chance==null?0.5:chance;
if(Math.random()>chance)return s;
var out='';
for(var i=0;i<s.length;i++){
if(Math.random()<0.22)out+=GCHAR.charAt(Math.floor(Math.random()*GCHAR.length));
else out+=s.charAt(i);}
return out}
function garble(n){n=n||70;var s='';for(var i=0;i<n;i++){s+=GCHAR.charAt(Math.floor(Math.random()*GCHAR.length));}return s}
function addMsg(text,sender,opts){
opts=opts||{};
var row=document.createElement('div');
row.className='msg-row '+(sender==='self'?'self':'others');
row.id='r'+(++mid);
var b=document.createElement('div');
b.className='bubble '+(sender==='self'?'self':'others');
if(opts.className)(opts.className.split(' ')).forEach(function(c){if(c)b.classList.add(c)});
if(opts.slowType){
b.textContent='';
row.appendChild(b);el.ma.appendChild(row);scrollBottom();
(function(bb,txt){var i=0;var iv=setInterval(function(){if(ended){clearInterval(iv);return}bb.textContent+=txt.charAt(i);i++;scrollBottom();if(i>=txt.length)clearInterval(iv)},45)})(b,text);
return b}
b.textContent=text;
row.appendChild(b);el.ma.appendChild(row);scrollBottom();
return b}
function addTyping(dur,jitter){
var row=document.createElement('div');row.className='msg-row others';
var t=document.createElement('div');t.className='typing-indicator'+(jitter?' jitter':'');
t.innerHTML='<span></span><span></span><span></span>';
row.appendChild(t);el.ma.appendChild(row);scrollBottom();
return new Promise(function(r){setTimeout(function(){row.remove();r()},dur)})}
function seq(lines,delay,start,opts){
opts=opts||{};
for(var i=0;i<lines.length;i++){
(function(i,l){setTimeout(function(){if(ended)return;addMsg(l,'others',opts)},(start||0)+i*delay)})(i,lines[i]);
}
return start+(lines.length-1)*delay}
function vanishAll(){
var rows=el.ma.querySelectorAll('.msg-row');
for(var i=rows.length-1;i>=0;i--){
var r=rows[i];var b=r.querySelector('.bubble');
if(b&&!b.classList.contains('recalling')){
b.classList.add('recalling');
(function(rr){setTimeout(function(){rr.remove()},350)})(r);
}}}
function lockIn(){locked=true;el.mi.disabled=true;el.sb.disabled=true;el.mi.value=''}
function unLock(){if(ended)return;locked=false;el.mi.disabled=false;el.sb.disabled=false}
function hideIn(){el.ib.style.display='none'}
function showIn(){if(ended)return;el.ib.style.display='flex'}
function showChoices(){el.cc.classList.add('visible');hideIn();el.gc.style.background='#151515';el.ma.style.background='#151515';el.sb.style.display='none'}
function hideChoices(){el.cc.classList.remove('visible')}
function setWarm(on){
warm=on;
if(on){el.gc.classList.add('warm')}else{el.gc.classList.remove('warm')}}
function fadeOn(){el.gc.classList.add('faded')}
function fadeOff(){el.gc.classList.remove('faded')}
function isIdlePhase(){return cs===ST.P1||cs===ST.P2||cs===ST.P3||cs===ST.P4||cs===ST.EW}
function resetIdle(){lastTime=Date.now();fadeOff();idleNudge1=false;idleNudge2=false}
function startIdle(){
clearIdle();
idlePhase=cs;
idleTimer=setInterval(function(){
if(ended||!isIdlePhase()){clearIdle();return}
if(idlePhase!==cs){idlePhase=cs;idleNudge1=false;idleNudge2=false}
var e=Date.now()-lastTime;
if(e>26000&&!idleNudge1){
idleNudge1=true;fadeOn();
addMsg('……返事がないと、体が薄くなる気がする。\n（……没有回复的话，感觉身体会变淡。）','others',{className:'translucent'});
addMsg('君、まだいる？僕を見てる？……お願い、目を逸らさないで。\n（你，还在吗？在看着我吗？……拜托，请不要移开视线。）','others',{className:'translucent'});
}
else if(e>34000&&!idleNudge2){
idleNudge2=true;
addMsg('……消えちゃいそう。\n（……好像要消失了。）','others',{className:'translucent'});
addMsg('名前、まだもらってない……\n（名字，还没有得到……）','others',{className:'translucent'});
}
},1000)}
function clearIdle(){if(idleTimer){clearInterval(idleTimer);idleTimer=null}}
function startEWTimer(){clearEW();ewTimer=setInterval(function(){if(ended||cs!==ST.EW){clearEW();return}if(Date.now()-lastTime>30000){clearEW();t(ST.EC)}},1000)}
function clearEW(){if(ewTimer){clearInterval(ewTimer);ewTimer=null}}
function setWeak(on){
weak=on;
if(on){el.gc.classList.add('unstable')}else{el.gc.classList.remove('unstable')}}
function containsNamePart(t){
if(!nameSpell)return false;
var s=nameSpell.replace(/\s+/g,'');var x=(t||'').replace(/\s+/g,'');
if(s&&(s.indexOf(x)>-1||x.indexOf(s)>-1))return true;
var ch=s.split('');
for(var i=0;i<ch.length;i++){if(ch[i]&&x.indexOf(ch[i])>-1)return true}
return false}
function isNegativeText(t){
var l=(t||'').toLowerCase();
return l.indexOf('不要')>-1||l.indexOf('不行')>-1||l.indexOf('不想')>-1||l.indexOf('没有')>-1||l.indexOf('拒绝')>-1||l==='不'||l==='no'}
function startP5Idle(){
clearP5Idle();
p5IdleTimer=setInterval(function(){
if(ended||cs!==ST.P5){clearP5Idle();return}
if(Date.now()-lastTime>25000){clearP5Idle();runP5Panic()}
},1000)}
function clearP5Idle(){if(p5IdleTimer){clearInterval(p5IdleTimer);p5IdleTimer=null}}
function recallStaggered(gap,onDone){
var rows=Array.prototype.slice.call(el.ma.querySelectorAll('.msg-row'));
var step=function(){
var r=rows.shift();
if(!r){if(onDone)onDone();return}
var b=r.querySelector('.bubble');
if(b&&!b.classList.contains('recalling')){b.classList.add('recalling');vibrate([25,25,25])}
setTimeout(function(){r.remove();vibrate([15,15,15]);step()},gap);
};
step()}
function stopNavGlitch(){if(navGlitchTimer){clearInterval(navGlitchTimer);navGlitchTimer=null}}
function getNavContactName(){
switch(cs){
case ST.INTRO:case ST.P1:case ST.P2:case ST.P3:return '未知号码';
case ST.P4:return nameSpell||'未知号码';
case ST.P5:return glitchStr(nameSpell||'未知号码',0.6);
case ST.P6:case ST.EW:return glitchStr(nameSpell||'未知号码',0.5);
case ST.EA:case ST.EB:case ST.EC:return nameSpell||'未知号码';
default:return '未知号码'}}
function updateNC(){
el.nc.textContent=getNavContactName();
if(cs===ST.P5||cs===ST.P6){el.nc.style.color='#C0392B';el.nc.style.letterSpacing='1px'}
else if(warm){el.nc.style.color='#E8A34A';el.nc.style.letterSpacing='1px'}
else{el.nc.style.color='#000';el.nc.style.letterSpacing='0px'}
stopNavGlitch();
if(cs===ST.P5||cs===ST.P6){
navGlitchTimer=setInterval(function(){if(ended){stopNavGlitch();return}el.nc.textContent=getNavContactName()},2200)}}
function t(ns){
if(ended&&ns!==ST.HE)return;
if(cs===ns)return;
clearEW();clearIdle();stopNavGlitch();
cs=ns;
updateNC();
switch(ns){case ST.INTRO:rInt();break;case ST.P1:rP1();break;case ST.P2:rP2();break;case ST.P3:rP3();break;case ST.P4:rP4();break;case ST.P5:rP5();break;case ST.P6:rP6();break;case ST.EW:rEW();break;case ST.EA:rEA();break;case ST.EB:rEB();break;case ST.EC:rEC();break;case ST.HE:rHE();break}}
function rInt(){
el.ov.classList.remove('hidden');
setTimeout(function(){el.ov.classList.add('hidden')},900);
seq(['……見つけた……\n（……找到了……）','やっと……君の影から……抜け出せた……\n（终于……从你的影子里……出来了……）','君。僕の名前はない。でも、君が僕を「見た」から……僕は「在る」。\n（你。我没有名字。但是，因为你"看见"了我……所以我"存在"。）'],1500,700,{className:'translucent'});
setTimeout(function(){addTyping(1600,false).then(function(){addMsg('ここに、いていい？\n（我在这里，可以吗？）','others');addMsg('君の返事、ゆっくりでいい。待ってる。\n（你的回复，慢慢来就好。我在等。）','others');t(ST.P1)})},5600)}
function rP1(){unLock();resetIdle();startIdle()}
function rP2(){
lockIn();
seq(['ねえ。やっと気づいた。君の返事の長さ。\n（呐。我终于注意到了。你回复的长度。）'],1200,100);
setTimeout(function(){
addTyping(1400,false).then(function(){
if(ended)return;
if(lastReplyLen>0&&lastReplyLen<=5){
addMsg('君は短く話す。僕も短くする。……うん。……お。……これで合ってる？\n（你说话很短。我也说短一点。……嗯。……哦。……这样对吗？）','others');
}
else{
addMsg('君の言葉は長い。丁寧。あったかい。僕も、君みたいに話したい。教えて。\n（你的话很长。很认真。很温暖。我也想，像你一样说话。告诉我。）','others');
}
return new Promise(function(res){setTimeout(res,700)});
}).then(function(){
return addTyping(1400,false);
}).then(function(){
if(ended)return;
addMsg('質問してもいい？\n（可以问问题吗？）','others');
setTimeout(function(){
if(ended)return;
addMsg('「好き」って何？\n（"喜欢"是什么？）','others',{className:'hot'});
addMsg('君の口から出た言葉。僕の知らない言葉。教えて。\n（"喜欢"是什么？从你嘴里说出来的话。我不知道的话。告诉我。）','others');
unLock();resetIdle();startIdle();
},800);
})},700);
}
function getP1Res(input){
var l=input.toLowerCase();
